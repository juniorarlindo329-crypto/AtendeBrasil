<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AtendeBrasil</title><link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-shell">
<section class="brand">
<img src="https://raw.githubusercontent.com/juniorarlindo329-crypto/AtendeBrasil/refs/heads/main/8e677106-9f51-4466-bee8-7f3edd203f42.png" class="brand-logo" alt="AtendeBrasil">
<h1>Atende<span>Brasil</span></h1><p>Inteligência que atende por você.</p>
</section>
<section class="auth-card">
<div id="loginBox">
<h2>Bem-vindo</h2><p class="muted">Entre na sua conta para continuar.</p>
<form id="loginForm">
<label>E-mail</label><input id="email" type="email" required>
<label>Senha</label><input id="senha" type="password" required>
<button class="primary" type="submit">Entrar</button>
</form>
<button id="forgotBtn" class="link-btn" type="button">Esqueci minha senha</button>
<p class="register">Ainda não tem uma conta? <button id="showSignup" class="inline-link" type="button">Criar conta</button></p>
</div>
<div id="signupBox" class="hidden">
<h2>Criar conta</h2>
<form id="signupForm">
<label>E-mail</label><input id="signupEmail" type="email" required>
<label>Senha</label><input id="signupSenha" type="password" minlength="6" required>
<button class="primary" type="submit">Criar conta</button>
</form>
<button id="showLogin" class="link-btn" type="button">Voltar para o login</button>
</div>
<div id="message" class="message hidden"></div>
</section>
<footer><strong>AtendeBrasil</strong><span>Versão 1.2.0</span><small>Desenvolvido por JNR</small></footer>
</main>
<script src="config.js"></script><script src="session.js"></script><script src="script.js"></script>
</body></html>
