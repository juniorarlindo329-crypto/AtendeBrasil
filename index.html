<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080810">

  <title>AtendeBrasil</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="logo-area">
      <img src="logo.png" alt="AtendeBrasil" class="logo">

      <h1>Atende<span>Brasil</span></h1>

      <p>
        Inteligência que atende por você.
      </p>
    </section>

    <section class="login">

      <h2>Bem-vindo</h2>

      <p class="subtitle">
        Entre na sua conta para continuar
      </p>

      <form>

        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          placeholder="seuemail@empresa.com"
          required
        >

        <label for="senha">Senha</label>

        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
          required
        >

        <a href="#" class="forgot">
          Esqueci minha senha
        </a>

        <button type="submit">
          Entrar
        </button>

      </form>

      <div class="divider">
        <span>ou</span>
      </div>

      <button class="google">
        Continuar com Google
      </button>

      <p class="register">
        Ainda não tem uma conta?
        <a href="#">Criar conta</a>
      </p>

    </section>

    <footer>
      <strong>AtendeBrasil</strong>
      <span>Versão 1.0.0</span>
      <small>Desenvolvido por JNR</small>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
