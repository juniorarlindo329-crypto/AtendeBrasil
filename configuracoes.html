<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Configurações | AtendeBrasil</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><div class="page-head"><a class="back" href="painel.html">‹</a><div><h1>Configurações</h1><p>Preferências gerais do aplicativo.</p></div></div>
<div class="settings-card"><h3>Perfil da empresa</h3><div class="field"><label>Nome exibido</label><input id="nomeEmpresa"></div><div class="field"><label>Telefone</label><input id="telefoneEmpresa"></div></div>
<div class="settings-card"><div class="switch-row"><div><h3>Notificações</h3><p>Ativar avisos dentro do aplicativo.</p></div><label class="switch"><input id="notificacoes" type="checkbox"><span></span></label></div></div>
<div class="settings-card"><div class="switch-row"><div><h3>Modo compacto</h3><p>Preferência visual salva no aparelho.</p></div><label class="switch"><input id="compacto" type="checkbox"><span></span></label></div></div>
<button id="salvarCfg" class="primary">Salvar configurações</button><button data-logout class="danger-btn" style="width:100%;margin-top:10px">Sair da conta</button>
</div><nav class="menu"><a href="painel.html" class=""><b>⌂</b>Início</a><a href="atendimentos.html" class=""><b>💬</b>Atender</a><a href="clientes.html" class=""><b>👥</b>Clientes</a><a href="ia.html" class=""><b>🤖</b>Minha IA</a><a href="relatorios.html" class=""><b>📊</b>Relatórios</a></nav>
<script src="config.js"></script><script src="session.js"></script><script src="app.js"></script>
<script>(async()=>{if(!(await AtendeUI.protect()))return;const key="atendebrasil_config";const cfg=JSON.parse(localStorage.getItem(key)||"{}");document.getElementById("nomeEmpresa").value=cfg.nome||"";document.getElementById("telefoneEmpresa").value=cfg.telefone||"";document.getElementById("notificacoes").checked=cfg.notificacoes!==false;document.getElementById("compacto").checked=!!cfg.compacto;document.getElementById("salvarCfg").onclick=()=>{localStorage.setItem(key,JSON.stringify({nome:document.getElementById("nomeEmpresa").value.trim(),telefone:document.getElementById("telefoneEmpresa").value.trim(),notificacoes:document.getElementById("notificacoes").checked,compacto:document.getElementById("compacto").checked}));AtendeUI.toast("Configurações salvas.")};})();</script></body></html>
