<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Clientes | AtendeBrasil</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><div class="page-head"><a class="back" href="painel.html">‹</a><div><h1>Clientes</h1><p>Cadastre, pesquise e abra o WhatsApp.</p></div></div>
<section class="stats"><div class="stat"><span>TOTAL</span><strong id="total">0</strong><small>Clientes</small></div><div class="stat"><span>NOVOS</span><strong id="novos">0</strong><small>Últimos 7 dias</small></div></section>
<div class="toolbar"><div class="search">🔎<input id="busca" placeholder="Buscar cliente..."></div><button id="novo" class="square-btn">+</button></div>
<div class="section-title"><h3>Sua base</h3><span id="contador">0 cadastrados</span></div><div id="lista" class="list"></div>
</div><nav class="menu"><a href="painel.html" class=""><b>⌂</b>Início</a><a href="atendimentos.html" class=""><b>💬</b>Atender</a><a href="clientes.html" class="active"><b>👥</b>Clientes</a><a href="ia.html" class=""><b>🤖</b>Minha IA</a><a href="relatorios.html" class=""><b>📊</b>Relatórios</a></nav>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-top"><h3>Novo cliente</h3><button id="fechar" class="close">✕</button></div>
<div class="field"><label>Nome</label><input id="nome"></div><div class="field"><label>Telefone / WhatsApp</label><input id="telefone"></div><div class="field"><label>E-mail</label><input id="email" type="email"></div>
<div class="form-actions"><button id="cancelar" class="secondary">Cancelar</button><button id="salvar" class="primary" style="margin-top:0">Salvar</button></div></div></div>
<script src="config.js"></script><script src="session.js"></script><script src="app.js"></script>
<script>
let clientes=[];
function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function whats(t){let n=String(t||"").replace(/\D/g,"");return n.startsWith("55")?n:"55"+n}
function render(q=""){const out=document.getElementById("lista");const f=q.toLowerCase().trim();const arr=clientes.filter(c=>`${c.nome||""} ${c.telefone||""} ${c.email||""}`.toLowerCase().includes(f));document.getElementById("total").textContent=clientes.length;const d=new Date();d.setDate(d.getDate()-7);document.getElementById("novos").textContent=clientes.filter(c=>c.criado_em&&new Date(c.criado_em)>=d).length;document.getElementById("contador").textContent=arr.length+" cadastrados";out.innerHTML="";if(!arr.length){out.innerHTML='<div class="empty"><div class="big">👥</div><p>Nenhum cliente encontrado.</p></div>';return}arr.forEach(c=>{const div=document.createElement("div");div.className="item";div.innerHTML=`<div class="avatar">${esc(c.nome).charAt(0).toUpperCase()}</div><div class="item-main"><strong>${esc(c.nome)}</strong><p>${esc(c.telefone)} · ${esc(c.email||"Sem e-mail")}</p></div><a class="chip" target="_blank" href="https://wa.me/${whats(c.telefone)}">WhatsApp</a>`;out.appendChild(div)})}
async function carregar(){const r=await AtendeSession.authFetch(`${ATENDE_CONFIG.SUPABASE_URL}/rest/v1/clientes?select=*&order=criado_em.desc`,{method:"GET"});if(r?.authExpired){location.replace("index.html");return}if(!r.ok){AtendeUI.toast("Erro ao carregar clientes.","error");return}clientes=await r.json();render()}
async function salvar(){const nome=document.getElementById("nome").value.trim(),telefone=document.getElementById("telefone").value.trim(),email=document.getElementById("email").value.trim();if(!nome||!telefone){AtendeUI.toast("Informe nome e telefone.","error");return}const body={nome,telefone,email:email||null};const user=AtendeSession.getUser();if(user?.id) body.user_id=user.id;const r=await AtendeSession.authFetch(`${ATENDE_CONFIG.SUPABASE_URL}/rest/v1/clientes`,{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(body)});if(r?.authExpired){location.replace("index.html");return}if(!r.ok){const t=await r.text();console.error(t);AtendeUI.toast("Não foi possível salvar o cliente.","error");return}document.getElementById("modal").classList.remove("show");["nome","telefone","email"].forEach(i=>document.getElementById(i).value="");await carregar();AtendeUI.toast("Cliente salvo com sucesso.")}
(async()=>{if(!(await AtendeUI.protect()))return;document.getElementById("novo").onclick=()=>document.getElementById("modal").classList.add("show");document.getElementById("fechar").onclick=document.getElementById("cancelar").onclick=()=>document.getElementById("modal").classList.remove("show");document.getElementById("salvar").onclick=salvar;document.getElementById("busca").oninput=e=>render(e.target.value);await carregar();})();
</script></body></html>
