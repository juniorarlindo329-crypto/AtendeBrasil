<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Atendimentos | AtendeBrasil</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><div class="page-head"><a class="back" href="painel.html">‹</a><div><h1>Atendimentos</h1><p>Central de conversas e contatos.</p></div></div>
<section class="stats"><div class="stat"><span>ABERTOS</span><strong id="abertos">0</strong><small>Conversas</small></div><div class="stat"><span>FINALIZADOS</span><strong id="finalizados">0</strong><small>Histórico</small></div></section>
<div class="toolbar"><div class="search">🔎<input id="busca" placeholder="Buscar atendimento..."></div><button id="novo" class="square-btn">+</button></div>
<div class="section-title"><h3>Conversas</h3><span>Toque para gerenciar</span></div><div id="lista" class="list"></div>
</div><nav class="menu"><a href="painel.html" class=""><b>⌂</b>Início</a><a href="atendimentos.html" class="active"><b>💬</b>Atender</a><a href="clientes.html" class=""><b>👥</b>Clientes</a><a href="ia.html" class=""><b>🤖</b>Minha IA</a><a href="relatorios.html" class=""><b>📊</b>Relatórios</a></nav>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-top"><h3>Novo atendimento</h3><button id="fechar" class="close">✕</button></div>
<div class="field"><label>Nome do cliente</label><input id="nome"></div><div class="field"><label>Telefone</label><input id="telefone"></div><div class="field"><label>Assunto</label><input id="assunto" placeholder="Ex.: orçamento, agendamento..."></div>
<div class="form-actions"><button id="cancelar" class="secondary">Cancelar</button><button id="criar" class="primary" style="margin-top:0">Criar</button></div></div></div>
<script src="config.js"></script><script src="session.js"></script><script src="app.js"></script>
<script>
let itens=JSON.parse(localStorage.getItem("atendebrasil_atendimentos")||"[]");
function save(){localStorage.setItem("atendebrasil_atendimentos",JSON.stringify(itens))}
function render(q=""){const box=document.getElementById("lista"),f=q.toLowerCase().trim(),arr=itens.filter(x=>`${x.nome} ${x.telefone} ${x.assunto}`.toLowerCase().includes(f));document.getElementById("abertos").textContent=itens.filter(x=>x.status!=="finalizado").length;document.getElementById("finalizados").textContent=itens.filter(x=>x.status==="finalizado").length;box.innerHTML="";if(!arr.length){box.innerHTML='<div class="empty"><div class="big">💬</div><p>Nenhum atendimento ainda.</p></div>';return}arr.forEach(x=>{const d=document.createElement("div");d.className="item";d.innerHTML=`<div class="avatar">💬</div><div class="item-main"><strong>${x.nome}</strong><p>${x.assunto||"Sem assunto"} · ${x.telefone}</p></div><button class="${x.status==="finalizado"?"secondary":"primary"}" style="width:auto;margin:0;padding:9px 10px" data-id="${x.id}">${x.status==="finalizado"?"Reabrir":"Finalizar"}</button>`;box.appendChild(d)});box.querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{const x=itens.find(i=>i.id===b.dataset.id);x.status=x.status==="finalizado"?"aberto":"finalizado";save();render(document.getElementById("busca").value);AtendeUI.toast("Status atualizado.")})}
(async()=>{if(!(await AtendeUI.protect()))return;render();document.getElementById("novo").onclick=()=>document.getElementById("modal").classList.add("show");document.getElementById("fechar").onclick=document.getElementById("cancelar").onclick=()=>document.getElementById("modal").classList.remove("show");document.getElementById("busca").oninput=e=>render(e.target.value);document.getElementById("criar").onclick=()=>{const nome=document.getElementById("nome").value.trim(),telefone=document.getElementById("telefone").value.trim(),assunto=document.getElementById("assunto").value.trim();if(!nome||!telefone){AtendeUI.toast("Informe nome e telefone.","error");return}itens.unshift({id:String(Date.now()),nome,telefone,assunto,status:"aberto",criado_em:new Date().toISOString()});save();document.getElementById("modal").classList.remove("show");["nome","telefone","assunto"].forEach(i=>document.getElementById(i).value="");render();AtendeUI.toast("Atendimento criado.")};})();
</script></body></html>
