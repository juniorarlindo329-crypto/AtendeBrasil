<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Relatórios | AtendeBrasil</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><div class="page-head"><a class="back" href="painel.html">‹</a><div><h1>Relatórios</h1><p>Resumo da operação do AtendeBrasil.</p></div></div>
<section class="stats"><div class="stat"><span>CLIENTES</span><strong id="clientes">0</strong><small>Cadastrados</small></div><div class="stat"><span>ATENDIMENTOS</span><strong id="atendimentos">0</strong><small>Registrados</small></div></section>
<div class="panel-card"><div class="metric"><span>Conversas abertas</span><strong id="abertos">0</strong></div><div class="metric"><span>Conversas finalizadas</span><strong id="finalizados">0</strong></div><div class="metric"><span>Taxa de conclusão</span><strong id="taxa">0%</strong></div><div class="progress"><i id="barra" style="width:0%"></i></div></div>
<div class="section-title"><h3>Atalhos</h3><span>Acesso rápido</span></div><div class="quick-actions"><a class="quick" href="clientes.html"><strong>👥 Clientes</strong><small>Ver base</small></a><a class="quick" href="atendimentos.html"><strong>💬 Atendimentos</strong><small>Ver conversas</small></a></div>
</div><nav class="menu"><a href="painel.html" class=""><b>⌂</b>Início</a><a href="atendimentos.html" class=""><b>💬</b>Atender</a><a href="clientes.html" class=""><b>👥</b>Clientes</a><a href="ia.html" class=""><b>🤖</b>Minha IA</a><a href="relatorios.html" class="active"><b>📊</b>Relatórios</a></nav>
<script src="config.js"></script><script src="session.js"></script><script src="app.js"></script>
<script>(async()=>{if(!(await AtendeUI.protect()))return;const ats=JSON.parse(localStorage.getItem("atendebrasil_atendimentos")||"[]"),fin=ats.filter(x=>x.status==="finalizado").length,ab=ats.length-fin,taxa=ats.length?Math.round(fin/ats.length*100):0;document.getElementById("atendimentos").textContent=ats.length;document.getElementById("abertos").textContent=ab;document.getElementById("finalizados").textContent=fin;document.getElementById("taxa").textContent=taxa+"%";document.getElementById("barra").style.width=taxa+"%";const r=await AtendeSession.authFetch(`${ATENDE_CONFIG.SUPABASE_URL}/rest/v1/clientes?select=id`,{method:"GET"});if(r?.ok){const d=await r.json();document.getElementById("clientes").textContent=d.length}})();</script></body></html>
